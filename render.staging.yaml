# Blueprint de prueba en el tier gratis de Render — para testear el
# estado de `staging` antes de promoverlo a producción (main). No
# reemplaza a render.yaml: ese es el de producción (branch main, plan
# starter, dominio real) y no se toca acá.
#
# Cómo conectarlo en Render (dashboard > New > Blueprint):
# 1. Elegir este repositorio.
# 2. Rama a sincronizar: staging.
# 3. Ruta del archivo de blueprint: render.staging.yaml — el asistente
#    de Render suele tener un campo para esto ("render.yaml Path" o
#    similar) cuando no querés usar el render.yaml de la raíz por
#    default. Si esa versión del asistente no lo ofrece, la alternativa
#    de abajo funciona seguro.
#
# Alternativa sin depender de esa opción del asistente: crear una rama
# nueva desde `staging` que no se mergea a ningún lado (por ejemplo
# `deploy-staging-test`), renombrar este archivo a `render.yaml` ahí, y
# conectar el Blueprint a esa rama en vez de a `staging`.
#
# Verificar contra la documentación actual de Render antes de aplicar:
# nombres de plan y de región cambian con el tiempo y esto no se probó
# contra una cuenta real.
#
# Qué hay que saber del free tier antes de usarlo:
# - El servicio web se "duerme" a los ~15 min sin tráfico; el primer
#   request después de eso tarda 30-50s (cold start). Sirve para
#   probar, no para mostrárselo a un cliente en vivo sin avisar.
# - La base Postgres free de Render se borra a los 30 días si no pasa a
#   un plan pago. Alcanza para este test, no para dejarla así de forma
#   permanente.
# - BETTER_AUTH_SECRET se genera solo. RESEND_API_KEY y GITHUB_TOKEN no
#   están acá a propósito: el deploy funciona igual sin ellas, solo
#   fallan en silencio el envío de mails y el sync de repositorios de
#   GitHub (mismo comportamiento que en local sin configurarlas) —
#   agregarlas a mano en el dashboard del servicio si hace falta probar
#   esas partes puntuales.
# - BETTER_AUTH_URL de abajo asume que Render acepta el nombre
#   "mirage-web-staging" tal cual (los nombres de servicio son únicos
#   por cuenta, no globalmente — no debería chocar, pero si Render
#   asigna otra URL hay que editar esta variable en el dashboard del
#   servicio para que coincida antes de usar el login).
databases:
  - name: mirage-db-staging
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: mirage-web-staging
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: staging
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mirage-db-staging
          property: connectionString
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://mirage-web-staging.onrender.com
