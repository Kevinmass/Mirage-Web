# Blueprint de Render (Infrastructure as Code). Conectar el repo desde
# Render > New > Blueprint apunta acá y crea el web service + la base en
# un solo paso, con auto-deploy en cada push a main.
#
# Verificar contra la documentación actual de Render antes de aplicar:
# nombres de plan y de región cambian con el tiempo y no los puedo probar
# sin acceso a una cuenta de Render.
#
# Un solo servicio sirve los tres dominios del diseño §3 (miragesoftware.
# com.ar, .online, .store) — lo que cambia el comportamiento (indexar o
# no, redirigir) es el host de cada request, no una variable de entorno
# por deploy (ver src/lib/dominio.ts, robots.ts, proxy.ts). Falta
# agregar los tres dominios como Custom Domain en la configuración del
# servicio en Render y apuntar su DNS ahí — eso no es parte de este
# archivo, lo hace quien tenga acceso a la cuenta.
databases:
  - name: mirage-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: web
    name: mirage-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mirage-db
          property: connectionString
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://miragesoftware.com.ar
